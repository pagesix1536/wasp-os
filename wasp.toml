# The default build for wasp-os. Modify to customize your own build.
# At least one watch face must be specified. Quick ring apps will be added in order.

[[app]]
file = 'apps/alarm.py'
quick_ring = true

[[app]]
file = 'apps/timer.py'
quick_ring = true

[[app]]
file = 'apps/heart.py'
auto_load = true

[[app]]
file = 'apps/weather.py'
auto_load = true

[[app]]
file = 'apps/music_player.py'
auto_load = true

[[app]]
file = 'apps/memory.py'

# WeekClockApp subclasses ClockApp — both must be frozen or boot hangs on main.py
[[watchface]]
file = 'watch_faces/clock.py'

[[watchface]]
file = 'watch_faces/week_clock.py'
default = true
