# The default build for wasp-os. Modify to customize your own build.
# At least one watch face must be specified. Quick ring apps will be added in order.

[[app]]
file = 'apps/alarm.py'
quick_ring = true

# Timer: frozen only (issue #2). Rarely used — enable in Software when wanted.
# Not quick-ring: a running countdown still works once enabled (alarm + instance).
[[app]]
file = 'apps/timer.py'

# Heart / Weather / Music: frozen only (issue #2). Enable in Software when wanted.
[[app]]
file = 'apps/heart.py'

[[app]]
file = 'apps/weather.py'

[[app]]
file = 'apps/music_player.py'

[[app]]
file = 'apps/memory.py'

[[app]]
file = 'apps/storage.py'

# Gallery: frozen only. Enable in Software to preview RGB565 BMPs in gallery/.
[[app]]
file = 'apps/gallery.py'

# Watch-face picker: frozen only. Enable in Software to switch Clock12h / Beach.
[[app]]
file = 'apps/faces.py'

# Default watch face (issue #1). Self-contained — no clock.py dependency.
[[watchface]]
file = 'watch_faces/clock_us.py'
default = true

# Prototype analogue-on-photo face (issue #19).
[[watchface]]
file = 'watch_faces/beach.py'
