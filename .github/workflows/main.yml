name: wasp-os binary distribution

# ---------------------------------------------------------------------------
# DISABLED on this personal fork (pagesix1536/wasp-os).
#
# Reasons:
#   - Nordic SoftDevice download in CI returns HTTP 403; the job always fails.
#   - This fork only targets PineTime and builds/flashes locally (Podman +
#     tools/build-flash-pinetime.sh). Multi-board dist (p8/k9/…) is not needed.
#
# The full job body is intentionally left intact so it can be re-enabled later.
#
# To re-enable automatic CI:
#   1. Restore the original `on:` triggers below (push / pull_request / dispatch).
#   2. Remove the job-level `if: false` line under `jobs.build`.
#   3. Commit and push (or re-enable via GitHub UI if you disabled it there).
#
# Original triggers (for restore):
#   on:
#     push:
#       branches: [ master ]
#     pull_request:
#       branches: [ master ]
#     workflow_dispatch:
# ---------------------------------------------------------------------------

# No automatic runs. workflow_dispatch kept so this remains a valid workflow
# file; the job is still skipped via `if: false` even if started manually.
on:
  workflow_dispatch:

jobs:
  build:
    if: false  # hard-disable; remove this line when re-enabling
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout files
      id:   checkout-files
      uses: actions/checkout@v4

    - name: Check the cached arm-none-eabi-gcc compiler
      id:   cache-toolchain
      uses: actions/cache@v4
      env:
        cache-name: cache-toolchain-10-2020-q4
      with:
          path: ${{ runner.temp }}/arm-none-eabi
          key:  ${{ runner.os }}-build-${{ env.cache-name }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}

    - name: Install arm-none-eabi-gcc
      id:   install-toolchain
      # installs arm-none-eabi if the CI environment can't find it in the cache
      if:   steps.cache-toolchain.outputs.cache-hit != 'true'
      uses: fiam/arm-none-eabi-gcc@v1.0.4
      with:
          release: 10-2020-q4
          directory: ${{ runner.temp }}/arm-none-eabi

    - name: Install packages
      id: install-packages
      run:  |
          sudo apt-get update
          sudo apt-get install -y python3-sphinx python3-cryptography python3-cbor graphviz
          sudo pip3 install recommonmark tomli

    - name: Update submodules
      id:   update-submodules
      run:  |
          export PATH=$PATH:${{ runner.temp }}/arm-none-eabi/bin
          make -j `nproc` submodules

    - name: Download softdevice
      id:   download-softdevice
      run:  |
          export PATH=$PATH:${{ runner.temp }}/arm-none-eabi/bin
          make -j `nproc` softdevice

    - name: Build wasp-os binary distribution
      id:   binary-distribution
      run:  |
          export PATH=$PATH:${{ runner.temp }}/arm-none-eabi/bin
          make -j `nproc` VERSION=${{ github.sha }} dist
          mv ../wasp-os-${{ github.sha }}.tar.gz .

    - name: Build extra apps
      id:   apps
      run:  |
          export PATH=$PATH:${{ runner.temp }}/arm-none-eabi/bin
          make -j `nproc` apps

    - name: Upload full binary distribution
      id:   upload-binaries
      uses: actions/upload-artifact@v4
      with:
          name: wasp-os-${{ github.sha }}
          path: wasp-os-${{ github.sha }}.tar.gz

    - name: Upload pinetime binaries
      id:   upload-pinetime
      uses: actions/upload-artifact@v4
      with:
          name: pinetime-${{ github.sha }}
          path: build-pinetime

    - name: Upload Colmi P8 binaries
      id:   upload-p8
      uses: actions/upload-artifact@v4
      with:
          name: p8-${{ github.sha }}
          path: build-p8

    - name: Upload Senbono K9 binaries
      id:   upload-k9
      uses: actions/upload-artifact@v4
      with:
          name: k9-${{ github.sha }}
          path: build-k9

    - name: Upload extra apps binaries
      id:   upload-apps
      uses: actions/upload-artifact@v4
      with:
          name: apps-${{ github.sha }}
          path: apps/*.mpy
